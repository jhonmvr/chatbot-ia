version: "3.9"
services:
  postgres:
    image: ankane/pgvector:pg16
    env_file: .env
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  qdrant:
    image: qdrant/qdrant:latest
    env_file: .env
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    image: tiredofit/db-backup
    env_file: .env
    volumes:
      - backup_data:/backup
    environment:
      DB_HOST: postgres
      DB_NAME: "${POSTGRES_DB}"
      DB_USER: "${POSTGRES_USER}"
      DB_PASS: "${POSTGRES_PASSWORD}"
      DB_TYPE: pgsql
      CRON_PERIOD: "0 2 * * *"
    networks:
      - rag_network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  rag_network:

volumes:
  pg_data:
  qdrant_storage:
  backup_data:
