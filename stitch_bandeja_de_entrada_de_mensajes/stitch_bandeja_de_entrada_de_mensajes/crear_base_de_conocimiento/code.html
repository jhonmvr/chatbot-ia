<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Knowledge Base</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1173d4",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style>
        .form-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
            -webkit-print-color-adjust: exact;
            color-adjust: exact;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
<div class="flex flex-col min-h-screen">
<header class="bg-white dark:bg-background-dark border-b border-gray-200 dark:border-gray-700/50 shadow-sm">
<div class="container mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex justify-between items-center h-16">
<div class="flex items-center space-x-4">
<div class="text-primary size-8">
<svg fill="currentColor" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M36.7273 44C33.9891 44 31.6043 39.8386 30.3636 33.69C29.123 39.8386 26.7382 44 24 44C21.2618 44 18.877 39.8386 17.6364 33.69C16.3957 39.8386 14.0109 44 11.2727 44C7.25611 44 4 35.0457 4 24C4 12.9543 7.25611 4 11.2727 4C14.0109 4 16.3957 8.16144 17.6364 14.31C18.877 8.16144 21.2618 4 24 4C26.7382 4 29.123 8.16144 30.3636 14.31C31.6043 8.16144 33.9891 4 36.7273 4C40.7439 4 44 12.9543 44 24C44 35.0457 40.7439 44 36.7273 44Z"></path>
</svg>
</div>
<h1 class="text-xl font-bold text-gray-900 dark:text-white">Message Manager</h1>
</div>
<div class="hidden md:flex items-center space-x-8">
<a class="text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">Dashboard</a>
<a class="text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">Messages</a>
<a class="text-sm font-medium text-primary dark:text-primary" href="#">Knowledge Base</a>
<a class="text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">Settings</a>
</div>
<div class="flex items-center space-x-4">
<button class="relative p-2 rounded-full text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
<span class="material-symbols-outlined">
                            notifications
                            </span>
</button>
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCbGTPtHhFTu3BCYSmq3uxAy2BiIGk-wLWIQ54Ch4VCDkgWyc4RsNtY8UUGsr14XPU6WJRhuqKDDUPqTMuJM91hXcRYbFs3ctyxBddCbovzzqtsAoS3FuPxTFd3yQY4TlaeSfX9a2WfvXhCHz7aSxrV_lFguKTjxsFZTLuWTAgGg1UBT92ASBzHd_PaPoqVhhSzMKI4OcDhkJpvD_irsL_td082TZzwy6QQfWWZkQPP6y5IR5m5BJonwkRpiz7-jkP31x69zPO2mg");'></div>
</div>
</div>
</div>
</header>
<main class="flex-grow">
<div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
<div class="max-w-2xl mx-auto bg-white dark:bg-background-dark rounded-lg shadow-md">
<div class="p-6 sm:p-8 border-b border-gray-200 dark:border-gray-700/50">
<h2 class="text-2xl font-bold text-gray-900 dark:text-white">Create New Knowledge Base</h2>
<p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Fill in the details below to create a new knowledge base for a client.</p>
</div>
<form class="p-6 sm:p-8 space-y-6">
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300" for="client">Client</label>
<select class="form-select mt-1 block w-full pl-3 pr-10 py-3 text-base border-gray-300 dark:border-gray-600 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-200" id="client" name="client">
<option>Select a client</option>
<option>Client Alpha</option>
<option>Client Beta</option>
<option>Client Gamma</option>
</select>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300" for="kb-name">Knowledge Base Name</label>
<input class="mt-1 block w-full border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm py-3 px-4 focus:outline-none focus:ring-primary focus:border-primary bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500" id="kb-name" name="kb-name" placeholder="e.g., 'Product Documentation'" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300" for="description">Description</label>
<textarea class="mt-1 block w-full border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm py-3 px-4 focus:outline-none focus:ring-primary focus:border-primary bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 resize-none" id="description" name="description" placeholder="A brief description of what this knowledge base contains." rows="4"></textarea>
</div>
<div class="flex justify-end pt-4 space-x-3">
<button class="px-6 py-2.5 rounded-lg text-sm font-semibold bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors" type="button">
                                Cancel
                            </button>
<button class="inline-flex items-center px-6 py-2.5 border border-transparent text-sm font-semibold rounded-lg shadow-sm text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit">
                                Create Knowledge Base
                            </button>
</div>
</form>
</div>
</div>
</main>
</div>

</body></html>
